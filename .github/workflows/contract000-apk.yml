name: Nexo CONTRACT 027 APK

on:
  push:
    branches:
      - contract/027-property-facility-site-placement-separation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="cb05eb19ea239e5cb4d3c8cc97d2444e22276f5f"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'assets/data/property.facility.overlay.json' \
            'data/site_enrichment/2026-11-19_property_facility_semantic_separation.json' \
            'data/site_enrichment/2026-11-19_property_relationship_resolution.json' \
            'docs/ARCHITECTURE.md' \
            'docs/DATA_CONTRACT.md' \
            'docs/contracts/CONTRACT_026_PROPERTY_RELATIONSHIP_RESOLUTION.md' \
            'docs/contracts/CONTRACT_027_PROPERTY_FACILITY_SITE_PLACEMENT_SEPARATION.md' \
            'lib/features/knowledge/domain/knowledge.dart' \
            'lib/features/sites/data/property_facility_repository.dart' \
            'lib/features/sites/domain/property_facility.dart' \
            'pubspec.yaml' \
            'test/property_facility_semantics_test.dart' \
            'tool/validate_property_facility_semantics.py' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py
          python3 tool/validate_site_discoveries.py
          python3 tool/validate_site_identity_reconciliations.py
          python3 tool/validate_placement_verifications.py
          python3 tool/validate_site_verifications.py
          python3 tool/validate_site_enrichment_pilot.py
          python3 tool/validate_placement_enrichment_pilot.py
          python3 tool/validate_property_facility_semantics.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.13-build16-contract027-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 027 ACTIONS BUILD" \
            "base_source_commit=cb05eb19ea239e5cb4d3c8cc97d2444e22276f5f" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.13+16" \
            "apk_file=nexo-industrial-1.0.13-build16-contract027-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=CONTRACT 027 candidate. Property, Facility, Site and typed Placement semantics are separated; CONTRACT 025/026 state is preserved." \
            > dist/NEXO_CONTRACT_027_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.13-build16-contract027-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract027-apk-1.0.13-build16
          path: |
            dist/nexo-industrial-1.0.13-build16-contract027-actions.apk
            dist/NEXO_CONTRACT_027_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
