name: Nexo CONTRACT 023 APK

on:
  push:
    branches:
      - contract/023-site-discovery-creation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="c43d632b272ada1e4c93846d6545e865de0a4ede"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'assets/data/sites.discovered.overlay.json' \
            'assets/data/sites.verified.overlay.json' \
            'docs/ARCHITECTURE.md' \
            'docs/DATA_CONTRACT.md' \
            'docs/contracts/CONTRACT_023_SITE_DISCOVERY_CREATION.md' \
            'lib/features/sites/data/operational_site_verification_repository.dart' \
            'lib/features/sites/data/site_discovery_repository.dart' \
            'lib/features/sites/domain/site.dart' \
            'lib/features/sites/domain/site_discovery.dart' \
            'pubspec.yaml' \
            'test/operational_site_enrichment_pilot_test.dart' \
            'test/site_discovery_test.dart' \
            'tool/validate_site_discoveries.py' \
            'tool/validate_site_enrichment_pilot.py' \
            'tool/validate_site_verifications.py' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py
          python3 tool/validate_site_discoveries.py
          python3 tool/validate_site_verifications.py
          python3 tool/validate_site_enrichment_pilot.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.10-build13-contract023-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 023 ACTIONS BUILD" \
            "base_source_commit=c43d632b272ada1e4c93846d6545e865de0a4ede" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.10+13" \
            "apk_file=nexo-industrial-1.0.10-build13-contract023-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=CONTRACT 023 candidate. Additional Site identity is evidence-gated; missing coordinates remain an explicit placement gap." \
            > dist/NEXO_CONTRACT_000_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.10-build13-contract023-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract023-apk-1.0.10-build13
          path: |
            dist/nexo-industrial-1.0.10-build13-contract023-actions.apk
            dist/NEXO_CONTRACT_000_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
