name: Nexo CONTRACT 029 APK

on:
  push:
    branches:
      - contract/029-spatial-entity-map-ux-exposure-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="4f8f28c8a1bff80cfadf219cef4aa55a4deaff02"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'data/site_enrichment/2026-11-20_spatial_entity_map_ux_exposure_policy.json' \
            'docs/ARCHITECTURE.md' \
            'docs/DATA_CONTRACT.md' \
            'docs/contracts/CONTRACT_029_SPATIAL_ENTITY_MAP_UX_EXPOSURE_POLICY.md' \
            'lib/features/sites/data/spatial_entity_exposure_policy.dart' \
            'lib/features/sites/data/spatial_exposure_repository.dart' \
            'lib/features/sites/domain/spatial_exposure.dart' \
            'pubspec.yaml' \
            'test/spatial_exposure_policy_test.dart' \
            'tool/validate_spatial_exposure_policy.py' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py
          python3 tool/validate_site_discoveries.py
          python3 tool/validate_site_identity_reconciliations.py
          python3 tool/validate_placement_verifications.py
          python3 tool/validate_site_verifications.py
          python3 tool/validate_site_enrichment_pilot.py
          python3 tool/validate_placement_enrichment_pilot.py
          python3 tool/validate_property_facility_semantics.py
          python3 tool/validate_unified_spatial_authority.py
          python3 tool/validate_spatial_exposure_policy.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.15-build18-contract029-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 029 ACTIONS BUILD" \
            "base_source_commit=4f8f28c8a1bff80cfadf219cef4aa55a4deaff02" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.15+18" \
            "apk_file=nexo-industrial-1.0.15-build18-contract029-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=CONTRACT 029 candidate. Spatial exposure policy keeps 1,907 Site map markers, 370 nearby/navigation Sites and zero non-Site commercial exposure." \
            > dist/NEXO_CONTRACT_029_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.15-build18-contract029-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract029-apk-1.0.15-build18
          path: |
            dist/nexo-industrial-1.0.15-build18-contract029-actions.apk
            dist/NEXO_CONTRACT_029_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
