name: Nexo CONTRACT 000 APK

on:
  push:
    branches:
      - ci/nexo-contract000-apk-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="3ab3c2868af7cfa75bc8d9e9904925f0c01f5ea7"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'test/production_dataset_test.dart' \
            'test/public_professionals_test.dart' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.4-build7-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 000 ACTIONS BUILD" \
            "base_source_commit=3ab3c2868af7cfa75bc8d9e9904925f0c01f5ea7" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.4+7" \
            "apk_file=nexo-industrial-1.0.4-build7-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=Internal GitHub Actions build. Verify signature compatibility before updating an installed APK." \
            > dist/NEXO_CONTRACT_000_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.4-build7-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract000-apk-1.0.4-build7
          path: |
            dist/nexo-industrial-1.0.4-build7-actions.apk
            dist/NEXO_CONTRACT_000_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
