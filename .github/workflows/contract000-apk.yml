name: Nexo CONTRACT 032 APK

on:
  push:
    branches:
      - contract/032-legacy-company-spatial-field-removal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="0376ae90e5f4be58823610480eb4b9cc16b26fbc"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'data/site_enrichment/2026-11-20_legacy_company_spatial_field_removal.json' \
            'docs/ARCHITECTURE.md' \
            'docs/DATA_CONTRACT.md' \
            'docs/contracts/CONTRACT_032_LEGACY_COMPANY_SPATIAL_FIELD_REMOVAL.md' \
            'lib/features/companies/companies_screen.dart' \
            'lib/features/companies/company_detail_screen.dart' \
            'lib/features/companies/data/asset_company_repository.dart' \
            'lib/features/companies/domain/company.dart' \
            'lib/features/companies/nearby_companies_screen.dart' \
            'lib/features/map/map_screen.dart' \
            'lib/features/map/ranking_service.dart' \
            'lib/features/sites/domain/runtime_spatial_projection.dart' \
            'pubspec.yaml' \
            'test/legacy_company_spatial_field_removal_test.dart' \
            'test/production_dataset_test.dart' \
            'test/ranking_service_test.dart' \
            'tool/validate_legacy_company_spatial_removal.py' \
            'tool/validate_legacy_spatial_removal_readiness.py' \
            'tool/validate_runtime_spatial_integration.py' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py
          python3 tool/validate_site_discoveries.py
          python3 tool/validate_site_identity_reconciliations.py
          python3 tool/validate_placement_verifications.py
          python3 tool/validate_site_verifications.py
          python3 tool/validate_site_enrichment_pilot.py
          python3 tool/validate_placement_enrichment_pilot.py
          python3 tool/validate_property_facility_semantics.py
          python3 tool/validate_unified_spatial_authority.py
          python3 tool/validate_spatial_exposure_policy.py
          python3 tool/validate_runtime_spatial_integration.py
          python3 tool/validate_legacy_spatial_removal_readiness.py
          python3 tool/validate_legacy_company_spatial_removal.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.18-build21-contract032-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 032 ACTIONS BUILD" \
            "base_source_commit=17bc619ab81e3c6d5584c74cf99db39d02ac5e99" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.18+21" \
            "apk_file=nexo-industrial-1.0.18-build21-contract032-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=CONTRACT 032 candidate. Legacy Company spatial fields removed; runtime spatial authority remains Site/EntityPlacement." \
            > dist/NEXO_CONTRACT_032_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.18-build21-contract032-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract032-apk-1.0.18-build21
          path: |
            dist/nexo-industrial-1.0.18-build21-contract032-actions.apk
            dist/NEXO_CONTRACT_032_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
