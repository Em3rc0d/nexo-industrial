name: Nexo CONTRACT 028 APK

on:
  push:
    branches:
      - contract/028-unified-spatial-placement-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source drift
        shell: bash
        run: |
          set -euo pipefail
          BASE="f28da1b4ead0d0ee1c92cf939bc4d627a456011f"
          CHANGED="$(git diff --name-only "$BASE"..HEAD | sort)"
          echo "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/contract000-apk.yml' \
            'assets/data/property.facility.overlay.json' \
            'data/site_enrichment/2026-11-20_unified_spatial_placement_authority.json' \
            'docs/ARCHITECTURE.md' \
            'docs/DATA_CONTRACT.md' \
            'docs/contracts/CONTRACT_028_UNIFIED_SPATIAL_PLACEMENT_AUTHORITY.md' \
            'lib/features/knowledge/data/asset_knowledge_repository.dart' \
            'lib/features/sites/data/asset_site_repository.dart' \
            'lib/features/sites/data/placement_verification_repository.dart' \
            'lib/features/sites/data/property_facility_repository.dart' \
            'lib/features/sites/data/unified_spatial_placement_repository.dart' \
            'lib/features/sites/domain/placement_verification.dart' \
            'lib/features/sites/domain/property_facility.dart' \
            'lib/features/sites/domain/site.dart' \
            'lib/features/sites/domain/unified_spatial.dart' \
            'pubspec.yaml' \
            'test/site_placement_test.dart' \
            'test/unified_spatial_placement_test.dart' \
            'tool/validate_unified_spatial_authority.py' | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment receipt
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          python3 --version
          git rev-parse HEAD

      - name: Validate datasets
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_dataset.py
          python3 tool/validate_contact_patch.py
          python3 tool/validate_site_discoveries.py
          python3 tool/validate_site_identity_reconciliations.py
          python3 tool/validate_placement_verifications.py
          python3 tool/validate_site_verifications.py
          python3 tool/validate_site_enrichment_pilot.py
          python3 tool/validate_placement_enrichment_pilot.py
          python3 tool/validate_property_facility_semantics.py
          python3 tool/validate_unified_spatial_authority.py

      - name: Bootstrap Android, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          bash tool/bootstrap_android.sh

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Inspect APK and create receipt
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$AAPT" dump badging "$APK" | head -n 5 | tee dist/apk-badging.txt
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | head -n 1)"
          cp "$APK" "dist/nexo-industrial-1.0.14-build17-contract028-actions.apk"
          printf '%s\n' \
            "NEXO INDUSTRIAL - CONTRACT 028 ACTIONS BUILD" \
            "base_source_commit=f28da1b4ead0d0ee1c92cf939bc4d627a456011f" \
            "workflow_commit=$GITHUB_SHA" \
            "version=1.0.14+17" \
            "apk_file=nexo-industrial-1.0.14-build17-contract028-actions.apk" \
            "apk_sha256=$SHA256" \
            "apk_size_bytes=$SIZE" \
            "package_badging=$PACKAGE_LINE" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "note=CONTRACT 028 candidate. Unified spatial placement authority projects 1,907 Site Placements losslessly plus one non-actionable ANA Asset Placement." \
            > dist/NEXO_CONTRACT_028_ACTIONS_RECEIPT.txt
          sha256sum dist/nexo-industrial-1.0.14-build17-contract028-actions.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexo-contract028-apk-1.0.14-build17
          path: |
            dist/nexo-industrial-1.0.14-build17-contract028-actions.apk
            dist/NEXO_CONTRACT_028_ACTIONS_RECEIPT.txt
            dist/apk-signature.txt
            dist/apk-badging.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
