name: nexo_industrial
description: Radar comercial geografico para prospeccion industrial en campo.
publish_to: "none"
version: 1.0.18+21

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  geolocator: ^14.1.2
  latlong2: ^0.9.1
  sqflite: ^2.4.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/companies.production.json
    - assets/data/companies.commercial.overlay.json.gz
    - assets/data/companies.contact.patch.json
    - assets/data/companies.geolocation.overlay.json
    - assets/data/sites.verified.overlay.json
    - assets/data/sites.discovered.overlay.json
    - assets/data/site.placement.verified.overlay.json
    - assets/data/site.identity.reconciliation.overlay.json
    - assets/data/property.facility.overlay.json
    - data/people_enrichment/2026-11-11_mining_people.json
    - data/site_enrichment/2026-11-19_operational_site_pilot.json
    - data/site_enrichment/2026-11-19_placement_enrichment_pilot.json
    - data/site_enrichment/2026-11-19_site_identity_reconciliation.json
    - data/site_enrichment/2026-11-19_property_relationship_resolution.json
    - data/site_enrichment/2026-11-19_property_facility_semantic_separation.json
    - data/site_enrichment/2026-11-20_unified_spatial_placement_authority.json
    - data/site_enrichment/2026-11-20_spatial_entity_map_ux_exposure_policy.json
    - data/site_enrichment/2026-11-20_runtime_spatial_projection_integration.json
    - data/site_enrichment/2026-11-20_legacy_spatial_dependency_audit.json
    - data/site_enrichment/2026-11-20_legacy_company_spatial_field_removal.json
